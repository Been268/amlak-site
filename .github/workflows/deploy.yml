name: Deploy Firebase

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Hosting and Firestore rules
        # حساب سرویس فعلی مجوز serviceusage برای فعال‌سازی Storage API را ندارد.
        # قواعد Storage در مخزن نگه داشته شده‌اند و پس از اعطای مجوز مناسب جداگانه deploy می‌شوند.
        run: firebase deploy --project syatem-amlak --only hosting,firestore:rules --non-interactive
